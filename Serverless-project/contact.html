<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            width: 350px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: none;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Contact Us</h2>

    <input id="firstName" placeholder="First Name">
    <input id="lastName" placeholder="Last Name">
    <input id="email" placeholder="Email">
    <textarea id="message" placeholder="Message"></textarea>

    <button onclick="submitForm()">Submit</button>

</div>

<script>

const API_URL = "https://c9hkmgzgg8.execute-api.ap-southeast-1.amazonaws.com/dev"; // 🔥 Replace

async function submitForm(){

    const data = {
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
    };

    try{

        const res = await fetch(API_URL, {
            method: "POST",
            mode: "cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        if(res.ok){
            window.location.href = "success.html";
        } else {
            alert("Error submitting form");
        }

    }catch(err){
        alert("Network error");
    }

}

</script>

</body>
</html>
